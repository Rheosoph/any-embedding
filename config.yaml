    memory: "8Gi"
    sentence_transformers_version: "5.1.2"
    transformers_version: "4.44.2"
    model_code_repo: "jinaai/jina-bert-v2-qk-devlin-norm-1e-2"
    model_code_revision: "d7eb81eb85ad2ef05cf3954e614c4fb6c9a898ce"

[project]
name = "any-embedding-aws-microvm"
version = "0.1.0"
description = "Snapshot-ready embedding worker for AWS Lambda MicroVMs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.20,<1.0",
    "numpy==1.26.4",
    "sentence-transformers==2.7.0",
    "torch==2.3.1",
    "transformers==4.39.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
